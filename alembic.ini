# Configuração do Alembic para VigiMinas
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Formato de geração de revisões
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# A URL é injetada dinamicamente via env.py lendo app.core.config.settings.DATABASE_URL_SYNC
sqlalchemy.url = postgresql+psycopg2://vigiminas_user:vigiminas_pass@localhost:5434/vigiminas_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
